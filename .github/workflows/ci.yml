name: Axion System CI pipeline

trigger:
  branches:
    include:
      - main
      - master
pr:
  branches:
    include:
      - main
      - master

pool:
  name: 'IntelAgent'

stages:
  - stage: CI
    displayName: 'Continuous Integration'
    jobs:
      - job: Terraform_CI
        displayName: 'Terraform Lint & Validate'
        steps:
          - powershell: |
              Write-Host "Checking Terraform formatting..."
              terraform fmt -check -recursive
            displayName: 'Terraform Format Check'

          - powershell: |
              Write-Host "Initializing Terraform..."
              terraform init -backend=false
            displayName: 'Terraform Init'

          - powershell: |
              Write-Host "Validating Terraform code..."
              terraform validate
            displayName: 'Terraform Validate'

          - powershell: |
              Write-Host "Checking TFLint version..."
              tflint --version
              Write-Host "Initializing TFLint plugins..."
              tflint --init
              Write-Host "Running TFLint recursively..."
              tflint --recursive
            displayName: 'TFLint'
